<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas card harness</title>
<style>
  /* Home Assistant's default light theme; ?dark switches to its dark theme. */
  :root {
    --primary-color: #03a9f4;
    --text-primary-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --disabled-color: #bdbdbd;
    --divider-color: rgba(0, 0, 0, 0.12);
    --error-color: #db4437;
    --primary-background-color: #fafafa;
    --secondary-background-color: #e5e5e5;
    --card-background-color: #ffffff;
    --ha-card-border-radius: 12px;
  }
  :root.dark {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --disabled-color: #6f6f6f;
    --divider-color: rgba(225, 225, 225, 0.12);
    --primary-background-color: #111111;
    --secondary-background-color: #282828;
    --card-background-color: #1c1c1c;
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--primary-background-color);
    font-family: Roboto, system-ui, sans-serif;
  }
  twinkly-canvas-card { display: block; max-width: 500px; }  /* one dashboard column */
</style>
<script>if (location.search.includes("dark")) document.documentElement.classList.add("dark");</script>
<script src="fake_hass.js"></script>
<!-- Home Assistant loads the card as a module; a classic script works from file:// -->
<script src="../../custom_components/twinkly_canvas/frontend/twinkly-canvas-card.js"></script>
</head>
<body>
<twinkly-canvas-card></twinkly-canvas-card>
<script>
  const card = document.querySelector("twinkly-canvas-card");
  card.setConfig({ entity: "light.test_tree" });
  card.hass = window.hass;
</script>
</body>
</html>
